# Scroll the content of a sheet that is at its peek detent. The drive sheet's peek top edge is at
# about 55% of the screen, so a swipe that starts at 88% is inside the sheet (a swipe from the
# screen centre would pan the map instead).
appId: app.milewire.mobile
---
- swipe:
    start: 50%, 88%
    end: 50%, 60%
    duration: 400
